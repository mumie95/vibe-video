name: Render Vibe Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Remotion browser and Linux dependencies
        run: npx remotion browser ensure

      - name: TypeScript check
        run: npm run typecheck

      - name: Render video
        run: npm run render

      - name: Upload rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: vibe-video-output
          path: output.mp4
          if-no-files-found: error
          retention-days: 7
